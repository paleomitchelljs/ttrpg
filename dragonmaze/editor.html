<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragon Maze — Tile Editor</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #1c1b22; color: #e8e4ef; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #26242e; border-bottom: 1px solid #3a3746; flex: none; }
  header select, header button { font: inherit; background: #34313f; color: #e8e4ef; border: 1px solid #4a4658; border-radius: 6px; padding: 5px 9px; }
  header button { cursor: pointer; }
  header button.primary { background: #3d6a4f; border-color: #4f8a66; }
  header button.primary:hover { background: #4a8060; }
  .modebtn.on { background: #4a5a8a; border-color: #6c86d0; }
  #status { margin-left: auto; color: #a9a4bb; font-size: 13px; }
  .maponly, .sheetonly { display: flex; gap: 10px; align-items: center; }
  main { display: flex; flex: 1; min-height: 0; }
  #palette { width: 190px; flex: none; overflow-y: auto; padding: 8px; background: #221f2a; border-right: 1px solid #3a3746; }
  #tagfilter { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  #tagfilter button { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #2e2b38; color: #b8b3c9; border: 1px solid #43404f; cursor: pointer; }
  #tagfilter button.on { background: #4a5a8a; color: #fff; border-color: #6c86d0; }
  #swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; }
  /* Base-tile swatches: smaller than decor (there are more of them, and they
     are read by silhouette rather than by name). */
  #basebar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  #basebar .swatch { padding: 2px; font-size: 9px; }
  #basebar .swatch img { width: 100%; display: block; border-radius: 3px; }
  #basebar .swatch span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #basebar .swatch[data-bk=""] { display: flex; align-items: center; justify-content: center;
    min-height: 38px; font-size: 11px; color: #b8b3c9; }
  .palhint { color: #7d7890; font-weight: normal; }
  .palnote { color: #7d7890; font-size: 11px; }
  /* A cell whose art is pinned by hand, so it is obvious which ones you have
     taken off the autotiler. Editor-only. */
  .cell.pinned { box-shadow: inset 0 0 0 2px #ffcc44; }
  .swatch { position: relative; background: #2e2b38; border: 2px solid transparent; border-radius: 6px; padding: 4px; cursor: pointer; text-align: center; }
  .swatch.on { border-color: #6cc0ff; }
  .swatch img { width: 100%; height: 50px; object-fit: contain; image-rendering: pixelated; display: block; }
  .swatch span { font-size: 10px; color: #b8b3c9; word-break: break-all; }
  .swatch em { font-size: 9px; color: #7f7a93; font-style: normal; display: block; }
  .swatch-hide { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; line-height: 16px; padding: 0; font-size: 12px; border-radius: 4px; background: #0007; color: #e6b0b0; border: 1px solid #6a4b4b; cursor: pointer; opacity: 0; transition: opacity .12s; }
  .swatch:hover .swatch-hide { opacity: 1; }
  .swatch-hide:hover { background: #7a2f2f; color: #fff; }
  #stagewrap { flex: 1; overflow: auto; padding: 20px; }
  #stage { position: relative; background: #111; box-shadow: 0 0 0 1px #000; }
  .cell { position: absolute; box-sizing: border-box; }
  .cell.floor { background: #6f8a54; }
  .cell.wall { background: #6b5f4e; box-shadow: inset 0 0 0 1px #0003; }
  .cell.door { background: #9a723c; box-shadow: inset 0 0 0 2px #d9b877; }
  .cell.edge { box-shadow: inset 0 0 0 2px #e7d27a; }
  .cell.mark { outline: 1px dashed #ffffff33; outline-offset: -3px; }
  .cell.selcell { outline: 2px solid #ffd24a; outline-offset: -2px; box-shadow: inset 0 0 0 200px #ffd24a2e; z-index: 500; }
  .cell.water { background: #35566a; }
  /* Invisible wall: floor art in-game, but the editor hatches it red so you can
     see the collision you laid under decor. */
  .cell.inviswall { position: relative; }
  .cell.inviswall::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(45deg, #ff5b5b66 0 4px, transparent 4px 9px);
    box-shadow: inset 0 0 0 1px #ff5b5b88; }
  /* Start/exit/door badge, kept legible over autotiled art. */
  .cbadge { position: absolute; top: 1px; left: 2px; font: 700 10px/1.3 system-ui, sans-serif; color: #fff; background: #000a; border-radius: 3px; padding: 0 3px; pointer-events: none; z-index: 400; }
  /* Theme-faithful base tiles: undecorated cells use the same art the game
     renders (styles.css), so an empty grass tile is pixel-identical to placed
     grass decor. Mirrors #map[data-theme] in styles.css. */
  #stage[data-theme] .cell.floor, #stage[data-theme] .cell.wall { image-rendering: pixelated; }
  #stage[data-theme='grass'] .cell.floor { background: url('./assets/tiles/courtyard-grass.png') 0 0 / 100% 100%; }
  #stage[data-theme='grass'] .cell.wall  { background: url('./assets/tiles/courtyard-wall-brick.png') 0 0 / 100% 100%; }
  #stage[data-theme='sand'] .cell.floor  { background: url('./assets/worldtiles/atlas/sand.png') 0 0 / 100% 100%; }
  #stage[data-theme='sand'] .cell.wall   { background: url('./assets/worldtiles/atlas/sand_dark2.png') 0 0 / 100% 100%; box-shadow: inset 0 0 10px #00000066; }
  #stage[data-theme='swamp'] .cell.floor { background: url('./assets/worldtiles/atlas/swamp_ground.png') 0 0 / 100% 100%; }
  #stage[data-theme='swamp'] .cell.wall  { background: url('./assets/worldtiles/atlas/stone.png') 0 0 / 100% 100%; filter: brightness(0.7); }
  #stage[data-theme='dark'] .cell.floor  { background: url('./assets/worldtiles/atlas/cave_floor.png') 0 0 / 100% 100%; }
  #stage[data-theme='dark'] .cell.wall   { background: url('./assets/worldtiles/atlas/cave_floor_solid.png') 0 0 / 100% 100%; filter: brightness(0.55); }
  #stage[data-theme='sewer'] .cell.floor { background: url('./assets/tiles/sewer-floor.png') 0 0 / 100% 100%; }
  #stage[data-theme='sewer'] .cell.wall  { background: url('./assets/tiles/sewer-wall.png') 0 0 / 100% 100%; }
  .obj { position: absolute; cursor: move; }
  .obj img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; pointer-events: none; transform-origin: center; }
  .obj.sel { outline: 2px solid #6cc0ff; outline-offset: 1px; }
  /* palette section labels + the paint-tiles bar */
  .palgroup { margin-bottom: 10px; }
  .pallabel { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: #8a86a0; margin: 0 0 4px; }
  #tilebar { display: flex; flex-wrap: wrap; gap: 4px; }
  #tilebar button { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #2e2b38; color: #d8d3e9; border: 1px solid #43404f; cursor: pointer; }
  #tilebar button.on { background: #4a5a8a; border-color: #6c86d0; color: #fff; }
  /* marker brushes + tokens (monsters, loot, bosses) */
  #markerbar { display: flex; flex-wrap: wrap; gap: 4px; }
  #markerbar button { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #2e2b38; color: #d8d3e9; border: 1px solid #43404f; cursor: pointer; }
  #markerbar button.on { background: #8a5a4a; border-color: #d0866c; color: #fff; }
  .marker { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: move; overflow: hidden; }
  .marker .ico { font-size: 20px; line-height: 1; filter: drop-shadow(0 1px 1px #000); pointer-events: none; }
  .marker .ico-img { width: 84%; height: 84%; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 1px 1px #000); pointer-events: none; }
  .marker .cap { font-size: 8px; line-height: 1.2; color: #e8e4ef; background: #0009; border-radius: 3px; padding: 0 3px; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; pointer-events: none; }
  .marker.monsters .cap { color: #ffd0c8; }
  .marker.loot .cap { color: #ffe6a0; }
  .marker.portals .cap { color: #9fdcff; }
  .marker.sel { outline: 2px solid #ffd24a; outline-offset: 1px; border-radius: 4px; }
  /* sheet slicer */
  #sheetview { flex: 1; overflow: auto; padding: 20px; display: none; }
  #sheetview.on { display: block; }
  #sheetwrap { position: relative; display: inline-block; background: #2a0033; }
  #sheetimg { display: block; image-rendering: pixelated; }
  .box { position: absolute; border: 1px solid #00e6ff88; cursor: pointer; }
  .box:hover { border-color: #6cffff; background: #00e6ff22; }
  .box.sel { border: 2px solid #ffd24a; background: #ffd24a22; }
  #inspector, #sliceform { width: 220px; flex: none; padding: 10px; background: #221f2a; border-left: 1px solid #3a3746; overflow-y: auto; }
  #sliceform { display: none; }
  h3 { margin: 0 0 8px; font-size: 13px; color: #b8b3c9; }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
  .row label { width: 52px; color: #a9a4bb; }
  .row button { width: 26px; height: 26px; background: #34313f; color: #e8e4ef; border: 1px solid #4a4658; border-radius: 5px; cursor: pointer; }
  .row input { flex: 1; min-width: 0; background: #34313f; color: #e8e4ef; border: 1px solid #4a4658; border-radius: 5px; padding: 4px 6px; }
  .val { min-width: 34px; text-align: center; }
  .bigbtn { width: 100%; border-radius: 6px; padding: 7px; cursor: pointer; border: 1px solid; margin-top: 6px; }
  .bigbtn.go { background: #3d6a4f; border-color: #4f8a66; color: #fff; }
  .bigbtn.del { background: #6a3838; border-color: #8a4f4f; color: #fff; }
  .hint { color: #8a86a0; font-size: 12px; margin-top: 10px; line-height: 1.5; }
  kbd { background: #34313f; border: 1px solid #4a4658; border-radius: 4px; padding: 0 4px; font-size: 11px; }
  /* Enemies / Items editor */
  #entityview { flex: 1; min-height: 0; display: none; }
  #entityview.on { display: flex; }
  #entityList { width: 250px; flex: none; overflow-y: auto; padding: 8px; background: #221f2a; border-right: 1px solid #3a3746; }
  #entityList .elhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  #entityList .elhead input { flex: 1; min-width: 0; font: inherit; padding: 3px 6px; background: #2a2833; color: #e8e4ef; border: 1px solid #43404f; border-radius: 5px; }
  #entityList .erow { padding: 5px 7px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #entityList .erow:hover { background: #2e2b38; }
  #entityList .erow.on { background: #4a5a8a; color: #fff; }
  #entityForm { flex: 1; overflow-y: auto; padding: 12px 18px; }
  #entityForm .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 12px; align-items: end; }
  #entityForm label.field { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #b8b3c9; }
  #entityForm label.field input, #entityForm label.field select { font: inherit; padding: 4px 6px; background: #2a2833; color: #e8e4ef; border: 1px solid #43404f; border-radius: 5px; }
  #entityForm label.field input[readonly] { opacity: 0.55; }
  #entityForm .fsection { border-top: 1px solid #3a3746; margin-top: 14px; padding-top: 8px; }
  #entityForm .fsection > b { display: block; margin-bottom: 6px; color: #cfc9e0; }
  #entityForm .arow { display: grid; grid-template-columns: 2fr 1fr 1.3fr 1.2fr auto; gap: 6px; align-items: end; margin-bottom: 6px; }
  #entityForm .arow .arowdel { align-self: end; height: 28px; background: #6a3838; border: 1px solid #8a4f4f; color: #fff; border-radius: 5px; cursor: pointer; }
  #entityForm label.chk { display: block; margin: 6px 0; font-size: 13px; color: #cfc9e0; }
  #entityForm .minibtn, #entityList .elhead button { font: inherit; font-size: 12px; padding: 3px 9px; background: #34313f; color: #e8e4ef; border: 1px solid #4a4658; border-radius: 5px; cursor: pointer; }
  #entityForm .go { max-width: 240px; }
  /* Region editor (inside the map inspector) */
  #inspector .rsection { border-top: 1px solid #3a3746; margin-top: 12px; padding-top: 8px; }
  #inspector .rsection > b { display: block; margin-bottom: 6px; color: #cfc9e0; }
  #inspector .prow { display: grid; grid-template-columns: 1fr 42px 42px 24px; gap: 4px; margin-bottom: 4px; }
  #inspector .idrow { display: flex; gap: 4px; margin-bottom: 4px; }
  #inspector .idrow select { flex: 1; }
  #inspector .prow select, #inspector .prow input, #inspector .idrow select, #inspector label.field input {
    font: inherit; padding: 3px 5px; background: #2a2833; color: #e8e4ef; border: 1px solid #43404f; border-radius: 4px; min-width: 0; width: 100%; box-sizing: border-box; }
  #inspector .rrowdel { background: #6a3838; border: 1px solid #8a4f4f; color: #fff; border-radius: 4px; cursor: pointer; padding: 0; }
  #inspector .sublabel { font-size: 11px; color: #8a86a0; margin: 6px 0 3px; }
  #inspector label.field { display: block; margin: 4px 0; font-size: 12px; color: #b8b3c9; }
  #inspector .minibtn { font: inherit; font-size: 12px; padding: 3px 9px; margin: 4px 4px 0 0; background: #34313f; color: #e8e4ef; border: 1px solid #4a4658; border-radius: 5px; cursor: pointer; }
  #inspector details summary { cursor: pointer; color: #8a86a0; font-size: 12px; }
  #inspector details .hint { margin-top: 6px; }
</style>
</head>
<body>
<header>
  <button class="modebtn on" id="mMap">Map</button>
  <button class="modebtn" id="mSheet">Slice sheet</button>
  <button class="modebtn" id="mEnemies">Enemies</button>
  <button class="modebtn" id="mItems">Items</button>
  <span class="maponly">
    <label>Zone <select id="zoneSel"></select></label>
    <label>Region <select id="regionSel"></select></label>
    <button class="primary" id="saveBtn">Save</button>
    <button id="scaleDown">−</button><button id="scaleUp">+</button>
  </span>
  <span class="sheetonly" style="display:none">
    <label>Sheet <select id="sheetSel"></select></label>
    <button id="detectBtn">Detect objects</button>
  </span>
  <span id="status"></span>
</header>
<main>
  <div id="palette">
    <div class="palgroup"><div class="pallabel">Paint base tile</div><div id="tilebar"></div></div>
    <div class="palgroup">
      <div class="pallabel">Base tile art <span class="palhint">(pin one cell)</span></div>
      <div id="basebar"></div>
    </div>
    <div class="palgroup"><div class="pallabel">Add to map</div><div id="markerbar"></div></div>
    <div class="palgroup">
      <div class="pallabel">Decor</div>
      <div id="tagfilter"></div>
      <div id="swatches"></div>
    </div>
  </div>
  <div id="stagewrap"><div id="stage"></div></div>
  <div id="sheetview"><div id="sheetwrap"><img id="sheetimg" alt=""></div></div>
  <div id="inspector"></div>
  <div id="sliceform"></div>
  <div id="entityview">
    <div id="entityList"></div>
    <div id="entityForm"></div>
  </div>
</main>
<script type="module" src="./editor.js"></script>
</body>
</html>
